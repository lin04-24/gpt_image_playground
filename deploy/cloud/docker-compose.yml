services:
  gpt-image-playground:
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile
    ports:
      - '3000:3000'
    environment:
      LOGIN_TOKEN: ${LOGIN_TOKEN:-${SYNC_PASSWORD:?请在 .env 中设置 LOGIN_TOKEN}}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      API_PROXY_URL: ${API_PROXY_URL:?请在 .env 中设置 API_PROXY_URL}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
